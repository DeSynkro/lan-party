name: Build, test and scan

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"

jobs:
  test:
    name: Build and test
    # Test on the oldest supported build baseline: Ubuntu 22.04 with GTK 4.6
    # and GLib 2.72.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev
      - name: Vet
        run: |
          # GTK packages use cgo and are compiled by the test/build steps.
          # Vet the backend packages that do not require GTK here.
          packages=$(go list ./... | grep -vE '/(internal/gtkui|cmd/lan-party|cmd/gtk-probe)$')
          go vet $packages
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o /tmp/lan-party ./cmd/lan-party

  vuln:
    name: Security scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev
      - name: Build for vulnerability scan
        run: go build -trimpath -o /tmp/lan-party ./cmd/lan-party
      - name: govulncheck
        # Source mode cannot type-check gotk4's cgo bindings. Scan the real
        # binary instead so the linked code and dependencies are covered.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary /tmp/lan-party

  linux:
    name: Linux AppImage
    # Build for every main/tag push and manual run; PRs only run the checks.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, vuln]
    # Ubuntu 22.04 keeps the AppImage floor low: GTK 4.6, GLib 2.72,
    # GLIBC_2.34 and x86-64-baseline. Pin the image explicitly so a rolling
    # ubuntu-latest migration cannot raise that floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev \
            xvfb
      - name: Build AppImage
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            version="dev-${GITHUB_SHA::7}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${version}" ./build/appimage.sh
      - name: Smoke test AppImage
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          export GDK_BACKEND=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          export GSK_RENDERER=cairo
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CACHE_HOME="$(mktemp -d)"
          appimage="$(ls dist/*.AppImage | head -1)"
          xvfb-run -a bash -c '
            "$0" >/tmp/appimage.log 2>&1 &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "AppImage exited during startup" >&2
              cat /tmp/appimage.log
              exit 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          ' "$appimage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows portable zip
    # Build for every main/tag push and manual run; PRs only run the checks.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [test, vuln]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip
            unzip
      - name: Build and test
        shell: msys2 {0}
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig

          go_bin=go
          if [ -n "${GOROOT:-}" ]; then
            go_root="$(cygpath -u "$GOROOT" 2>/dev/null || true)"
            if [ -n "$go_root" ] && [ -x "$go_root/bin/go.exe" ]; then
              go_bin="$go_root/bin/go.exe"
            fi
          fi
          if ! command -v "$go_bin" >/dev/null 2>&1; then
            go_bin="$(find /c/hostedtoolcache/windows/go -name go.exe -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$go_bin" ]; then
            echo "Go toolchain not found" >&2
            exit 1
          fi

          echo "go_bin=$go_bin"
          "$go_bin" version

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          export VERSION="${version}"
          export GO_BIN="${go_bin}"
          bash build/windows.sh

          "$go_bin" test -count=1 \
            ./internal/applog \
            ./internal/config \
            ./internal/autostart \
            ./internal/group \
            ./internal/invite \
            ./internal/secure \
            ./internal/session \
            ./internal/tunnel \
            ./internal/app
      - name: Check release archive
        shell: msys2 {0}
        run: |
          listing="$(unzip -l dist/*.zip)"
          case "${listing}" in
            *"lan-party/lan-party.exe"*) ;;
            *) echo "release archive is missing lan-party.exe" >&2; exit 1 ;;
          esac
          case "${listing}" in
            *"lan-party/lan-party-console.exe"*)
              echo "release archive contains lan-party-console.exe" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/lan-party-build.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, vuln, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.AppImage *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${notes}" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.AppImage dist/*.zip dist/SHA256SUMS --draft \
              --title "LAN Party ${GITHUB_REF_NAME#v}" \
              --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.AppImage dist/*.zip dist/SHA256SUMS --draft --generate-notes
          fi
