name: Windows spike

on:
  workflow_dispatch:
  push:
    branches: [windows-spike]

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      # Temporary spike workflow. Pin this action before it becomes permanent.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gcc
      - name: Build LAN Party
        shell: msys2 {0}
        run: |
          export CC=x86_64-w64-mingw32-gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          go_bin="$(cygpath -u "$GOROOT")/bin/go.exe"
          if [ ! -x "$go_bin" ]; then
            go_bin=go
          fi
          "$go_bin" version
          "$go_bin" build -trimpath -o lan-party.exe ./cmd/lan-party
          "$go_bin" version -m lan-party.exe > lan-party-build.txt
      - name: Run backend tests
        shell: msys2 {0}
        run: |
          export CC=x86_64-w64-mingw32-gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          go_bin="$(cygpath -u "$GOROOT")/bin/go.exe"
          if [ ! -x "$go_bin" ]; then
            go_bin=go
          fi
          "$go_bin" test -count=1 \
            ./internal/config \
            ./internal/autostart \
            ./internal/group \
            ./internal/invite \
            ./internal/secure \
            ./internal/session \
            ./internal/tunnel \
            ./internal/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-spike
          path: |
            lan-party.exe
            lan-party-build.txt
          if-no-files-found: error
          retention-days: 14
