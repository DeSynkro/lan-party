name: Windows spike

on:
  workflow_dispatch:
  push:
    branches: [windows-spike]

permissions:
  contents: read

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      # Temporary spike workflow. Pin this action before it becomes permanent.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip
      - name: Build LAN Party
        shell: msys2 {0}
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          go_bin=go
          if [ -n "${GOROOT:-}" ]; then
            go_root="$(cygpath -u "$GOROOT" 2>/dev/null || true)"
            if [ -n "$go_root" ] && [ -x "$go_root/bin/go.exe" ]; then
              go_bin="$go_root/bin/go.exe"
            fi
          fi
          if ! command -v "$go_bin" >/dev/null 2>&1; then
            go_bin="$(find /c/hostedtoolcache/windows/go -name go.exe -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$go_bin" ]; then
            echo "Go toolchain not found" >&2
            exit 1
          fi
          echo "go_bin=$go_bin"
          "$go_bin" version
          export GO_BIN="$go_bin"
          export VERSION="1.1.0-dev-${GITHUB_SHA::7}"
          bash build/windows.sh
      - name: Run backend tests
        shell: msys2 {0}
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig
          go_bin=go
          if [ -n "${GOROOT:-}" ]; then
            go_root="$(cygpath -u "$GOROOT" 2>/dev/null || true)"
            if [ -n "$go_root" ] && [ -x "$go_root/bin/go.exe" ]; then
              go_bin="$go_root/bin/go.exe"
            fi
          fi
          if ! command -v "$go_bin" >/dev/null 2>&1; then
            go_bin="$(find /c/hostedtoolcache/windows/go -name go.exe -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$go_bin" ]; then
            echo "Go toolchain not found" >&2
            exit 1
          fi
          echo "go_bin=$go_bin"
          "$go_bin" version
          "$go_bin" test -count=1 \
            ./internal/config \
            ./internal/autostart \
            ./internal/group \
            ./internal/invite \
            ./internal/secure \
            ./internal/session \
            ./internal/tunnel \
            ./internal/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-spike
          path: |
            dist/*.zip
            dist/lan-party-build.txt
          if-no-files-found: error
          retention-days: 14
