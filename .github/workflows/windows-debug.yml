name: Windows debug build

# Manual only. The normal Build, test and scan workflow builds the release zip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-debug:
    name: Windows debug zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip
            unzip
      - name: Build debug zip
        shell: msys2 {0}
        run: |
          export CC=gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig

          go_bin=go
          if [ -n "${GOROOT:-}" ]; then
            go_root="$(cygpath -u "$GOROOT" 2>/dev/null || true)"
            if [ -n "$go_root" ] && [ -x "$go_root/bin/go.exe" ]; then
              go_bin="$go_root/bin/go.exe"
            fi
          fi
          if ! command -v "$go_bin" >/dev/null 2>&1; then
            go_bin="$(find /c/hostedtoolcache/windows/go -name go.exe -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$go_bin" ]; then
            echo "Go toolchain not found" >&2
            exit 1
          fi

          echo "go_bin=$go_bin"
          "$go_bin" version
          export VERSION="debug-${GITHUB_SHA::7}"
          export GO_BIN="${go_bin}"
          export INCLUDE_CONSOLE=1
          bash build/windows.sh

          "$go_bin" test -count=1 \
            ./internal/applog \
            ./internal/config \
            ./internal/autostart \
            ./internal/group \
            ./internal/invite \
            ./internal/secure \
            ./internal/session \
            ./internal/tunnel \
            ./internal/app
      - name: Check debug archive
        shell: msys2 {0}
        run: |
          listing="$(unzip -l dist/*.zip)"
          case "${listing}" in
            *"lan-party/lan-party.exe"*) ;;
            *) echo "debug archive is missing lan-party.exe" >&2; exit 1 ;;
          esac
          case "${listing}" in
            *"lan-party/lan-party-console.exe"*) ;;
            *) echo "debug archive is missing lan-party-console.exe" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-debug
          path: |
            dist/*.zip
            dist/lan-party-build.txt
          if-no-files-found: error
          retention-days: 14
