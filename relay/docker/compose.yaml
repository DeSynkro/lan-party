# LAN Party relay.
#
# From a source checkout, compose.override.yaml builds a local image:
#   cp .env.example .env
#   sudo docker compose up --build -d
#
# From the release zip, the published image is used:
#   cp .env.example .env
#   sudo docker compose up -d
#
# See README.md for the public address, firewall and profile steps.
services:
  # Make the named volume writable by the non-root relay image. Runs once and
  # exits before the relay starts.
  relay-init:
    image: busybox:1.36
    user: "0:0"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - relay-data:/data
    command: ["sh", "-c", "chown -R 65532:65532 /data"]

  relay:
    image: "${LANPARTY_RELAY_IMAGE:-ghcr.io/desynkro/lan-party-relay:1.2}"
    restart: unless-stopped
    depends_on:
      relay-init:
        condition: service_completed_successfully
    environment:
      LANPARTY_RELAY_CONFIG: /data/relay.json
      # Applied to the config and host profile on every start. Change these
      # in .env for a VPS.
      LANPARTY_RELAY_PUBLIC_HOST: "${LANPARTY_RELAY_PUBLIC_HOST:-127.0.0.1}"
      LANPARTY_RELAY_PUBLIC_PORT: "${LANPARTY_RELAY_PORT:-7443}"
      # Optional. If empty, the first start generates a strong password.
      LANPARTY_RELAY_PASSWORD: "${LANPARTY_RELAY_PASSWORD:-}"
    ports:
      - "${LANPARTY_RELAY_PORT:-7443}:7443/tcp"
      - "${LANPARTY_RELAY_PORT:-7443}:7443/udp"
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay-data:
