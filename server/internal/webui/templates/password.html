{{define "content"}}
<p class="small"><a href="/settings">Settings</a> / Password</p>
<section class="card narrow">
  <p class="eyebrow">Admin password</p>
  <h1>Change password</h1>
  <p class="muted">At least 12 characters. Every browser is signed out when the password changes.</p>
  <form method="post" action="/settings/password" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="current">Current password
      <input id="current" type="password" name="current" autocomplete="current-password" required autofocus>
    </label>
    <label for="new">New password
      <input id="new" type="password" name="new" autocomplete="new-password" minlength="12" required>
    </label>
    <label for="confirm">Repeat the new password
      <input id="confirm" type="password" name="confirm" autocomplete="new-password" minlength="12" required>
    </label>
    <div class="actions">
      <button type="submit" class="primary">Change password</button>
      <a class="button" href="/settings">Cancel</a>
    </div>
  </form>
</section>
{{end}}
