# LAN Party web host.
#
# From a source checkout, this is all a new user needs:
#   sudo docker compose up --build -d
#   sudo docker compose logs lan-party-web | grep -A2 "admin password"
#
# From the release zip, the published image is pulled:
#   sudo docker compose up -d
#
# setup.sh is optional; it sets PUID/PGID and a chosen password.
services:
  # Make ./data writable by the container user. Runs once per start and exits.
  lan-party-web-init:
    image: busybox:1.36
    user: "0:0"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    command: ["sh", "-c", "mkdir -p /data && chown -R ${PUID:-1000}:${PGID:-1000} /data && chmod 700 /data"]

  lan-party-web:
    image: "${LANPARTY_WEB_IMAGE:-ghcr.io/desynkro/lan-party-web:1.3}"
    restart: unless-stopped
    depends_on:
      lan-party-web-init:
        condition: service_completed_successfully
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${LANPARTY_WEB_BIND:-0.0.0.0}:${LANPARTY_WEB_PORT:-8080}:8080/tcp"
      - "${LANPARTY_APP_PORT:-51820}:${LANPARTY_APP_PORT:-51820}/udp"
    environment:
      LANPARTY_WEB_DATA_DIR: /data
      LANPARTY_WEB_LISTEN: 0.0.0.0:8080
      LANPARTY_WEB_PORT: "${LANPARTY_WEB_PORT:-8080}"
      LANPARTY_WEB_CONTAINER: "1"
      LANPARTY_APP_PORT: "${LANPARTY_APP_PORT:-51820}"
      LANPARTY_WEB_TLS_CERT: "${LANPARTY_WEB_TLS_CERT:-}"
      LANPARTY_WEB_TLS_KEY: "${LANPARTY_WEB_TLS_KEY:-}"
      LANPARTY_WEB_TRUSTED_PROXIES: "${LANPARTY_WEB_TRUSTED_PROXIES:-}"
    volumes:
      - ./data:/data
      - ./tls:/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/lan-party-web", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
