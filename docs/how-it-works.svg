    <text transform="matrix(1 0 0 1 100 486)" x="0" y="0" xml:space="preserve" font-family="&apos;IBM Plex Sans SmBld&apos;, sans-serif" font-size="21" font-weight="600" fill="#fdf4ff"><tspan x="0" y="0">Only the published service crosses the tunnel.</tspan></text>
    <text transform="matrix(1 0 0 1 100 516)" x="0" y="0" xml:space="preserve" font-family="&apos;IBM Plex Sans&apos;, sans-serif" font-size="16" fill="#b9a8d9"><tspan x="0" y="0">Your router, NAS and the rest of the LAN are never reachable. Friends never connect to each other; the host is the only peer.</tspan></text>
    <text transform="matrix(1 0 0 1 70 606)" x="0" y="0" xml:space="preserve" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="14" fill="#22d3ee"><tspan x="0" y="0">1</tspan></text>
