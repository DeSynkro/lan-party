    <text transform="matrix(1 0 0 1 470 606)" x="0" y="0" xml:space="preserve" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="14" fill="#8b5cf6"><tspan x="0" y="0">2</tspan></text>
    <text transform="matrix(1 0 0 1 490 606)" x="0" y="0" xml:space="preserve" font-family="&apos;IBM Plex Sans&apos;, sans-serif" font-size="15" fill="#b9a8d9"><tspan x="0" y="0">The friend&apos;s app opens a loopback port.</tspan></text>
    <text transform="matrix(1 0 0 1 870 606)" x="0" y="0" xml:space="preserve" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="14" fill="#ff3dbe"><tspan x="0" y="0">3</tspan></text>
