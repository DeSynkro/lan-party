    <text transform="matrix(1 0 0 1 70 660)" x="0" y="0" xml:space="preserve" font-family="&apos;JetBrains Mono&apos;, monospace" font-size="13" fill="#8e7bb5"><tspan x="0" y="0">desynkro.com</tspan></text>
    <text transform="matrix(1 0 0 1 1430 660)" x="0" y="0" xml:space="preserve" font-family="&apos;IBM Plex Sans&apos;, sans-serif" font-size="14" fill="#b9a8d9" text-anchor="end"><tspan x="0" y="0">No virtual network. No route to the rest of the LAN.</tspan></text>
