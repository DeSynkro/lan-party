<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="How LAN Party works: one game port is carried over an encrypted tunnel between the host and a friend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120A2E"/>
      <stop offset="0.55" stop-color="#0A0518"/>
      <stop offset="1" stop-color="#08040F"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3DBE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3DBE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#8B5CF6"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Noto Sans", sans-serif; }
      .title { fill: #FDF4FF; font-size: 38px; font-weight: 700; }
      .sub { fill: #C9B8E8; font-size: 19px; }
      .tag { fill: #22D3EE; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .card-title { fill: #FDF4FF; font-size: 22px; font-weight: 700; }
      .card-sub { fill: #907FAF; font-size: 15px; }
      .addr { fill: #22D3EE; font-size: 18px; font-family: "DejaVu Sans Mono", monospace; }
      .app { fill: #FDF4FF; font-size: 20px; font-weight: 700; }
      .small { fill: #C9B8E8; font-size: 15px; }
      .tiny { fill: #907FAF; font-size: 13px; }
      .pill { fill: #FDF4FF; font-size: 14px; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="638" rx="27" fill="none" stroke="#2C1A55" stroke-width="2"/>

  <text x="60" y="64" class="title">How LAN Party works</text>
  <text x="60" y="94" class="sub">One game port, carried privately across the internet.</text>

  <!-- Host card -->
  <rect x="60" y="140" width="320" height="350" rx="20" fill="#120A2E" stroke="#2C1A55" stroke-width="2"/>
  <text x="88" y="178" class="tag">YOUR PC · HOST</text>

  <rect x="86" y="202" width="268" height="76" rx="12" fill="#1A1038" stroke="#2C1A55" stroke-width="1.5"/>
  <text x="106" y="232" class="app">Game server</text>
  <text x="106" y="258" class="addr">192.168.1.50:25565</text>

  <path d="M 220 284 L 220 316" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrowDown)"/>

  <rect x="86" y="322" width="268" height="82" rx="12" fill="#1A1038" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="106" y="353" class="app">LAN Party</text>
  <text x="106" y="379" class="card-sub">publishes only that game port</text>

  <text x="88" y="446" class="tiny">Your other games, files and devices</text>
  <text x="88" y="466" class="tiny">are not shared.</text>

  <!-- Friend card -->
  <rect x="820" y="140" width="320" height="350" rx="20" fill="#120A2E" stroke="#2C1A55" stroke-width="2"/>
  <text x="848" y="178" class="tag">FRIEND’S PC</text>

  <rect x="846" y="202" width="268" height="82" rx="12" fill="#1A1038" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="866" y="233" class="app">LAN Party</text>
  <text x="866" y="259" class="card-sub">creates a local game address</text>

  <path d="M 980 284 L 980 316" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrowDown)"/>

  <rect x="846" y="322" width="268" height="76" rx="12" fill="#1A1038" stroke="#2C1A55" stroke-width="1.5"/>
  <text x="866" y="352" class="app">The game</text>
  <text x="866" y="378" class="addr">127.0.0.1:25565</text>

  <text x="848" y="446" class="tiny">No LAN address, no account,</text>
  <text x="848" y="466" class="tiny">no VPN client to configure.</text>

  <!-- Tunnel -->
  <path d="M 354 363 C 500 363 540 250 700 250 C 760 250 780 250 842 250"
        fill="none" stroke="url(#tunnel)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="600" y="214" text-anchor="middle" class="pill">encrypted tunnel</text>
  <text x="600" y="238" text-anchor="middle" class="tiny">one shared port on the host</text>

  <rect x="500" y="286" width="200" height="44" rx="22" fill="#0A0518" stroke="#2C1A55" stroke-width="1.5"/>
  <text x="600" y="314" text-anchor="middle" class="tiny">only the published port crosses</text>

  <!-- Bottom notes -->
  <circle cx="74" cy="542" r="5" fill="#4ADE80"/>
  <text x="90" y="548" class="small">The host sends a one-time invite, then approves the friend's device.</text>

  <circle cx="74" cy="576" r="5" fill="#22D3EE"/>
  <text x="90" y="582" class="small">The friend opens the game and connects to the local address shown by LAN Party.</text>

  <circle cx="74" cy="610" r="5" fill="#FF3DBE"/>
  <text x="90" y="616" class="small">The host can remove the friend at any time. The invite cannot be reused.</text>
</svg>
